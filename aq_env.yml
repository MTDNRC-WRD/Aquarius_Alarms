# Aquarius_Alarms - project environment (Python 3.13)
#
# Create:   conda env create -f aq_env.yml
# Activate: conda activate aquarius
# Update:   conda env update -f aq_env.yml --prune
#
# Pinned to Python 3.13 because aspose-cells-python (used by
# Gage_Form_Filler/core/Form_Filler.py for PDF export) does not yet support
# Python 3.14. Once it does, change python=3.13 to python=3.14.
# Check: https://pypi.org/project/aspose-cells-python/
name: aquarius
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pandas>=3.0       # all scripts
  - numpy             # GoldCreek/daily_weather.py, medians_calc.py
  - requests          # Aquarius API calls (brings urllib3 for Retry)
  - tqdm              # progress bars (Q_alarm_html, sensor_alarms_html, data getters)
  - openpyxl          # reading/writing the Excel site lists and the form template
  - pyarrow           # parquet files in Gage_Data_Getters/daily_datas
  - geopandas         # reading the AGOL .gdb (Form Filler, SQLite_builder); pulls in pyogrio
  - pip
  - pip:
      - aspose-cells-python   # PDF export in Form_Filler.py; license needed to avoid watermark